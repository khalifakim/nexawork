server:
  port: 8888

spring:
  application:
    name: nexawork-config-server
  cloud:
    config:
      server:
        native:
          search-locations: file:${CONFIG_REPO_PATH:/config-repo}
  profiles:
    active: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
