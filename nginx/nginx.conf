# NexaWork — Reverse proxy Nginx (production)
#
# Termine TLS, sert le frontend Angular en statique, route l'API et le trafic
# WebSocket vers l'API Gateway et les services temps réel.
#
# La visioconférence est déléguée à JaaS 8x8 (iframe chargée directement depuis
# le navigateur vers https://8x8.vc/{AppID}/{room}?jwt={token}) — aucun proxy
# nginx n'est nécessaire côté serveur. Voir référence V5.1 §9.9.

upstream api_gateway {
    server api-gateway:8080;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nexawork.crt;
    ssl_certificate_key /etc/nginx/ssl/nexawork.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Frontend Angular (build statique)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API Gateway (Spring Cloud Gateway)
    location /nexawork- {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket STOMP — Messaging Service
    location /nexawork-messaging-api-v1/ws {
        proxy_pass http://messaging-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # WebSocket STOMP — Notification Service
    location /nexawork-notification-api-v1/ws {
        proxy_pass http://notification-service:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
