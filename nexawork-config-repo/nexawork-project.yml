server:
  port: 8082
  servlet:
    context-path: /nexawork-project-api-v1

spring:
  application:
    name: nexawork-project
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_project_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:passe}
  flyway:
    locations: classpath:db/migration

management:
  health:
    group:
      readiness:
        include: "readinessState,db,rabbit"
