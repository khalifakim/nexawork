server:
  port: 8080

spring:
  cloud:
    gateway:
      # Spring Cloud 2025.0.x : les propriétés du gateway WebFlux sont sous
      # `spring.cloud.gateway.server.webflux.*` (l'ancien préfixe `spring.cloud.gateway.*`
      # est déprécié). Starter : spring-cloud-starter-gateway-server-webflux.
      server:
        webflux:
          routes:
            # Chaque service gère son propre context-path (/nexawork-{service}-api-v1)
            # — routage direct sur le préfixe, pas de RewritePath nécessaire.

            - id: auth-service
              uri: http://${AUTH_SERVICE_HOST:localhost}:8081
              predicates:
                - Path=/nexawork-auth-api-v1/**

            - id: project-service
              uri: http://${PROJECT_SERVICE_HOST:localhost}:8082
              predicates:
                - Path=/nexawork-project-api-v1/**

            - id: messaging-service
              uri: http://${MESSAGING_SERVICE_HOST:localhost}:8083
              predicates:
                - Path=/nexawork-messaging-api-v1/**

            - id: meeting-service
              uri: http://${MEETING_SERVICE_HOST:localhost}:8084
              predicates:
                - Path=/nexawork-meeting-api-v1/**

            - id: notification-service
              uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:8085
              predicates:
                - Path=/nexawork-notification-api-v1/**

            - id: file-service
              uri: http://${FILE_SERVICE_HOST:localhost}:8086
              predicates:
                - Path=/nexawork-file-api-v1/**

            - id: ged-service
              uri: http://${GED_SERVICE_HOST:localhost}:8087
              predicates:
                - Path=/nexawork-ged-api-v1/**

            # WebSocket — Messaging (STOMP). L'endpoint STOMP est servi SOUS le
            # context-path du service (/nexawork-messaging-api-v1/ws/messaging) :
            # on préfixe donc le path, sinon le handshake tombe en 404 (échec en boucle).
            - id: messaging-ws
              uri: ws://${MESSAGING_SERVICE_HOST:localhost}:8083
              predicates:
                - Path=/ws/messaging/**
              filters:
                - PrefixPath=/nexawork-messaging-api-v1

            # WebSocket — Notifications (même règle : préfixe du context-path).
            - id: notification-ws
              uri: ws://${NOTIFICATION_SERVICE_HOST:localhost}:8085
              predicates:
                - Path=/ws/notifications/**
              filters:
                - PrefixPath=/nexawork-notification-api-v1

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "${CORS_ORIGINS:http://localhost:4200}"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
