server:
  port: 8086
  servlet:
    context-path: /nexawork-file-api-v1
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

spring:
  application:
    name: nexawork-file
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_file_db}
    username: ${DB_USERNAME:nexawork}
    password: ${DB_PASSWORD:nexawork_pass}
  flyway:
    locations: classpath:db/migration

nexawork:
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:nexawork_minio}
    secret-key: ${MINIO_SECRET_KEY:nexawork_minio_secret}
    bucket-projects: nexawork-projects
    bucket-chat: nexawork-chat
