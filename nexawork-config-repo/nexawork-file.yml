server:
  port: 8086
  servlet:
    context-path: /nexawork-file-api-v1

spring:
  application:
    name: nexawork-file
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_file_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:passe}
  flyway:
    locations: classpath:db/migration

management:
  health:
    group:
      readiness:
        include: "readinessState,db,rabbit"

nexawork:
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:nexawork}
    secret-key: ${MINIO_SECRET_KEY:nexawork-passe}
    bucket-projects: nexawork-projects
    bucket-chat: nexawork-chat
