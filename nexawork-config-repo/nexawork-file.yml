server:
  port: 8086
  servlet:
    context-path: /nexawork-file-api-v1

spring:
  application:
    name: nexawork-file
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_file_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:passe}
  flyway:
    locations: classpath:db/migration

management:
  health:
    group:
      readiness:
        include: "readinessState,db,rabbit"

nexawork:
  minio:
    url: ${MINIO_URL:http://minio:9000}
    access-key: ${MINIO_USER:nexawork}
    secret-key: ${MINIO_PASS:nexawork-passe}
    # ─── Modèle à 3 buckets par domaine fonctionnel (voir V5.1 §5.3) ────────
    # Routage bucket côté BucketRouter selon le contexte d'upload :
    #   context=avatar               → bucket-users
    #   context=channel-msg|conv-msg → bucket-messaging
    #   context=ged|task-attachment|meeting-file → bucket-documents
    buckets:
      documents: nexawork-documents   # GED + pièces jointes + réunions persistées
      messaging: nexawork-messaging   # fichiers canaux + conversations + partage réunion
      users:     nexawork-users       # avatars, photos de profil
