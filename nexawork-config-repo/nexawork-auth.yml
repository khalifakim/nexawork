server:
  port: 8081
  servlet:
    context-path: /nexawork-auth-api-v1

spring:
  application:
    name: nexawork-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:passe}
  flyway:
    locations: classpath:db/migration

  # ─── SMTP Gmail (envoi transactionnel) ──────────────────────────────────────
  # Utilisé par l'Auth Service pour :
  #   - email de bienvenue à la création de compte
  #   - lien de vérification d'adresse email
  #   - lien de réinitialisation de mot de passe
  #   - notification d'invitation à un workspace
  # Voir référence V5.1 §3.8 (secrets) et 6-notes/PLAN_DEV_BACKEND.md §E.2.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

nexawork:
  jwt:
    refresh-token-validity-in-days: 7

  # Adresse expéditrice appliquée à tous les emails sortants.
  mail:
    from: ${SMTP_FROM}
    enabled: true
    # Base URL du frontend pour la construction des liens transactionnels
    # (invitation /auth/invite, reset /auth/forgot/new, vérification /auth/verify)
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

management:
  health:
    group:
      readiness:
        # `mail` volontairement exclu : l'emailing est asynchrone et best-effort —
        # une panne SMTP ne doit pas sortir le service de rotation.
        include: "readinessState,db,rabbit"
