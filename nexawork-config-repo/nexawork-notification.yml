server:
  port: 8085
  servlet:
    context-path: /nexawork-notification-api-v1

spring:
  application:
    name: nexawork-notification
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_notification_db}
    username: ${DB_USERNAME:nexawork}
    password: ${DB_PASSWORD:nexawork_pass}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
