server:
  port: 8085
  servlet:
    context-path: /nexawork-notification-api-v1

spring:
  application:
    name: nexawork-notification
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:passe}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

nexawork:
  # ─── Web Push VAPID (notifications push navigateur) ─────────────────────────
  # Clés ECDSA P-256 générées via `npx web-push generate-vapid-keys`.
  # Utilisées par le Notification Service pour envoyer des notifications push
  # aux abonnés (Chrome/Firefox/Edge), même quand l'app n'est pas ouverte.
  # Bibliothèque Java : nl.martijndwars:web-push (0.8.x).
  # Fallback : WebSocket STOMP si l'utilisateur est en ligne (pas de doublon).
  # Voir référence V5.1 §3.8 (secrets) et 6-notes/PLAN_DEV_BACKEND.md §E.3.
  push:
    enabled: true
    vapid:
      public-key: ${VAPID_PUBLIC_KEY}
      private-key: ${VAPID_PRIVATE_KEY}
      subject: ${VAPID_SUBJECT}

management:
  health:
    group:
      readiness:
        include: "readinessState,db,rabbit,redis"
