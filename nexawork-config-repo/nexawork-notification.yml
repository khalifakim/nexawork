server:
  port: 8085
  servlet:
    context-path: /nexawork-notification-api-v1

spring:
  application:
    name: nexawork-notification
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:nexawork_notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:passe}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # ─── SMTP Gmail (email pour certains types de notifications, table §4.7) ─────
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      # Le réseau est derrière un proxy TLS intercepteur : son certificat auto-signé
      # fait échouer le handshake (« Could not convert socket to TLS ») — c'est ce
      # qui empêchait l'email d'invitation d'invité externe de partir. Même
      # contournement que l'Auth Service (nexawork-auth.yml) ; à retirer en prod.
      mail.smtp.ssl.trust: ${SMTP_SSL_TRUST:*}

nexawork:
  # ─── Web Push VAPID (notifications push navigateur) ─────────────────────────
  # Clés ECDSA P-256 générées via `npx web-push generate-vapid-keys`.
  # Utilisées par le Notification Service pour envoyer des notifications push
  # aux abonnés (Chrome/Firefox/Edge), même quand l'app n'est pas ouverte.
  # Bibliothèque Java : nl.martijndwars:web-push (0.8.x).
  # Fallback : WebSocket STOMP si l'utilisateur est en ligne (pas de doublon).
  # Voir référence V5.1 §3.8 (secrets) et 6-notes/PLAN_DEV_BACKEND.md §E.3.
  push:
    enabled: true
    vapid:
      public-key: ${VAPID_PUBLIC_KEY}
      private-key: ${VAPID_PRIVATE_KEY}
      subject: ${VAPID_SUBJECT}

  # Email sortant (table de politique §4.7)
  mail:
    from: ${SMTP_FROM}
    enabled: true
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

management:
  health:
    group:
      readiness:
        include: "readinessState,db,rabbit,redis"
