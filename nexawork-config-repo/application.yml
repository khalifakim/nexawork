# Configuration commune à tous les microservices NexaWork
# Chaque service peut surcharger ces valeurs dans son fichier dédié

spring:
  # ─── Pool de connexions (CAUSE RACINE des « serveur ne répond pas ») ─────────
  # Sans configuration, Hikari applique maximum-pool-size=10 ET minimum-idle=10 :
  # chaque service garde donc 10 connexions ouvertes en permanence. Or UNE connexion
  # = UN processus PostgreSQL (~7 Mo). Avec 9 services : 90 processus (~630 Mo)
  # maintenus même application au repos, sur une VM Docker de 4,8 Go → swap → la VM
  # se fige (« thread starvation », housekeeper delta > 1 min) → PostgreSQL n'arrive
  # plus à répondre, ses clients coupent (« Broken pipe »), le postmaster croit à un
  # crash et repart en récupération, qui elle-même n'aboutit pas (disque saturé par
  # le swap) → boucle de crash.
  # On garde donc 1 connexion au repos et 5 en pointe (5 × 9 = 45 < max_connections=100).
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000        # 5 min — rend les connexions inutilisées
      max-lifetime: 900000        # 15 min — recycle avant tout timeout côté serveur
      keepalive-time: 120000      # 2 min — détecte une connexion morte sans attendre l'emprunt
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: nexawork
    password: nexawork-passe

nexawork:
  jwt:
    base64-secret: ${JWT_SECRET}
    # Access token 15 min (V5.1 §14.9) — le refresh token (7 j) est géré en base (rotation).
    token-validity-in-seconds: 900

nexawork-cors:
  allowed-origins: "${CORS_ORIGINS:http://localhost:4200}"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "Authorization,Content-Disposition"
  allow-credentials: true
  max-age: 1800

springdoc:
  # Désactivé en dev/intégration : l'init springdoc (~25 s au 1er appel) ralentit
  # inutilement la première requête. Réactiver (true) pour exposer Swagger.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
