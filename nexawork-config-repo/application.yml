# Configuration commune à tous les microservices NexaWork
# Chaque service peut surcharger ces valeurs dans son fichier dédié

spring:
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: nexawork
    password: nexawork-passe

nexawork:
  jwt:
    base64-secret: ${JWT_SECRET}
    # Access token 15 min (V5.1 §14.9) — le refresh token (7 j) est géré en base (rotation).
    token-validity-in-seconds: 900

nexawork-cors:
  allowed-origins: "${CORS_ORIGINS:http://localhost:4200}"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "Authorization,Content-Disposition"
  allow-credentials: true
  max-age: 1800

springdoc:
  # Désactivé en dev/intégration : l'init springdoc (~25 s au 1er appel) ralentit
  # inutilement la première requête. Réactiver (true) pour exposer Swagger.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
