# NexaWork — nginx : sert l'app Angular (SPA) ET proxifie les appels backend
# vers la Gateway. Le navigateur ne parle qu'à une seule origine (ce conteneur),
# nginx transmet en interne → pas de CORS, pas de localhost:8080 exposé.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # ─── API REST : toutes les routes des microservices (context-paths) ───────
    # Le frontend appelle /nexawork-{service}-api-v1/... (apiUrl vide, même origine).
    # nginx transmet l'URI complète à la Gateway, qui route sur le context-path.
    location /nexawork- {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 🔴 Sans cette ligne, la limite nginx par défaut (1 Mo) renvoyait 413 pour
        # tout upload > 1 Mo (photos, PDF, documents) — cause mesurée des échecs
        # d'upload GED / réunion / pièces jointes de tâche / fichiers de conversation.
        client_max_body_size 100m;
        # Stream l'upload directement vers le backend (pas de buffer disque intermédiaire
        # qui ajoute de la latence sur les gros fichiers).
        proxy_request_buffering off;
        # Uploads/downloads volumineux : marge au-delà des 60 s des requêtes courtes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── WebSocket STOMP (messaging + notifications) ──────────────────────────
    location /ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # connexions longue durée
    }

    # ─── Assets statiques (cache long) ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── SPA fallback (routes Angular) ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
