name: nexawork

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: nexawork-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexawork-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nexawork-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: "nexawork-cookie"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexawork-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Config Server ──────────────────────────────────────────────────────────
  config-server:
    build: ./nexawork-backend/nexawork-config-server
    container_name: nexawork-config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_PATH: /config-repo
    volumes:
      - ./nexawork-config-repo:/config-repo
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build: ./nexawork-backend/nexawork-auth-service
    container_name: nexawork-auth-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_auth_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/nexawork-auth-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Project Service ────────────────────────────────────────────────────────
  project-service:
    build: ./nexawork-backend/nexawork-project-service
    container_name: nexawork-project-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_project_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8082:8082"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/nexawork-project-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Messaging Service ──────────────────────────────────────────────────────
  messaging-service:
    build: ./nexawork-backend/nexawork-messaging-service
    container_name: nexawork-messaging-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_messaging_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8083:8083"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/nexawork-messaging-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Meeting Service ────────────────────────────────────────────────────────
  meeting-service:
    build: ./nexawork-backend/nexawork-meeting-service
    container_name: nexawork-meeting-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
      jitsi-web:
        condition: service_started
        required: false
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_meeting_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      JITSI_APP_ID: ${JITSI_APP_ID}
      JITSI_SECRET: ${JITSI_SECRET}
      JITSI_URL: https://localhost:8443
    ports:
      - "8084:8084"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/nexawork-meeting-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Notification Service ───────────────────────────────────────────────────
  notification-service:
    build: ./nexawork-backend/nexawork-notification-service
    container_name: nexawork-notification-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_notification_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "8085:8085"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/nexawork-notification-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── File Service ───────────────────────────────────────────────────────────
  file-service:
    build: ./nexawork-backend/nexawork-file-service
    container_name: nexawork-file-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_file_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
    ports:
      - "8086:8086"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/nexawork-file-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── GED Service ────────────────────────────────────────────────────────────
  ged-service:
    build: ./nexawork-backend/nexawork-ged-service
    container_name: nexawork-ged-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_ged_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8087:8087"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/nexawork-ged-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    build: ./nexawork-backend/nexawork-api-gateway
    container_name: nexawork-api-gateway
    depends_on:
      - auth-service
      - project-service
      - messaging-service
      - meeting-service
      - notification-service
      - file-service
      - ged-service
    environment:
      CONFIG_SERVER_URL: config-server
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH_SERVICE_HOST: auth-service
      PROJECT_SERVICE_HOST: project-service
      MESSAGING_SERVICE_HOST: messaging-service
      MEETING_SERVICE_HOST: meeting-service
      NOTIFICATION_SERVICE_HOST: notification-service
      FILE_SERVICE_HOST: file-service
      GED_SERVICE_HOST: ged-service
    ports:
      - "8080:8080"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend Angular ────────────────────────────────────────────────────────
  frontend:
    build: ./nexawork-frontend
    container_name: nexawork-frontend
    depends_on:
      - api-gateway
    ports:
      - "4200:80"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Jitsi Meet (4 conteneurs, réseau interne meet.jitsi) ───────────────────
  jitsi-web:
    image: jitsi/web:stable
    container_name: nexawork-jitsi-web
    restart: unless-stopped
    ports:
      - "8443:443"
    environment:
      - PUBLIC_URL=https://localhost:8443
      - ENABLE_AUTH=1
      - AUTH_TYPE=jwt
      - JWT_APP_ID=${JITSI_APP_ID}
      - JWT_APP_SECRET=${JITSI_SECRET}
      - JWT_ACCEPTED_ISSUERS=${JITSI_APP_ID}
      - JWT_ACCEPTED_AUDIENCES=${JITSI_APP_ID}
      - ENABLE_LOBBY=1
      - XMPP_SERVER=jitsi-prosody
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - TZ=Africa/Dakar
    volumes:
      - jitsi_web_data:/config
    networks:
      - default
      - meet.jitsi
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  jitsi-prosody:
    image: jitsi/prosody:stable
    container_name: nexawork-jitsi-prosody
    restart: unless-stopped
    expose:
      - "5222"
      - "5280"
      - "5347"
    environment:
      - AUTH_TYPE=jwt
      - JWT_APP_ID=${JITSI_APP_ID}
      - JWT_APP_SECRET=${JITSI_SECRET}
      - ENABLE_AUTH=1
      - ENABLE_LOBBY=1
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - TZ=Africa/Dakar
    volumes:
      - jitsi_prosody_data:/config
    networks:
      meet.jitsi:
        aliases:
          - meet.jitsi
          - auth.meet.jitsi
          - internal-muc.meet.jitsi
          - muc.meet.jitsi
          - guest.meet.jitsi
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5280/http-bind > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    container_name: nexawork-jitsi-jicofo
    restart: unless-stopped
    environment:
      - AUTH_TYPE=jwt
      - XMPP_SERVER=jitsi-prosody
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - TZ=Africa/Dakar
    networks:
      - meet.jitsi
    depends_on:
      - jitsi-prosody
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:8888/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  jitsi-jvb:
    image: jitsi/jvb:stable
    container_name: nexawork-jitsi-jvb
    restart: unless-stopped
    ports:
      - "10000:10000/udp"   # WebRTC media — port obligatoire
      - "4443:4443/tcp"     # Fallback TCP (réseaux bloquant UDP)
    environment:
      - XMPP_SERVER=jitsi-prosody
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=10000
      - JVB_TCP_HARVESTER_DISABLED=false
      - JVB_TCP_PORT=4443
      - DOCKER_HOST_ADDRESS=${DOCKER_HOST_ADDRESS}
      - TZ=Africa/Dakar
    networks:
      - meet.jitsi
    depends_on:
      - jitsi-prosody
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f jvb > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  jitsi_web_data:
  jitsi_prosody_data:

# ─── Réseaux ────────────────────────────────────────────────────────────────
networks:
  default:
    driver: bridge
  meet.jitsi:
    driver: bridge
