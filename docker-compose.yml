name: nexawork

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: nexawork-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexawork-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nexawork-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: "nexawork-cookie"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  # ─── RabbitMQ Init (sidecar one-shot) ───────────────────────────────────────
  # Applique scripts/init-rabbitmq.sh une fois que RabbitMQ est healthy :
  # crée l'exchange nexawork.events + les 7 queues métier + leurs bindings.
  # Le container s'arrête normalement après exécution (restart: no).
  # Le script rabbitmqadmin est fourni par l'image rabbitmq:3-management.
  # Voir 6-notes/PLAN_DEV_BACKEND.md §E.1 pour la justification du sidecar.
  rabbitmq-init:
    image: rabbitmq:3-management
    container_name: nexawork-rabbitmq-init
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MGMT_PORT: 15672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./scripts/init-rabbitmq.sh:/init-rabbitmq.sh:ro
    entrypoint: ["/bin/bash", "/init-rabbitmq.sh"]
    restart: "no"
    networks:
      - default

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexawork-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── MinIO Init (sidecar one-shot) ──────────────────────────────────────────
  # Applique scripts/init-minio.sh une fois que MinIO est healthy : crée les
  # 3 buckets métier en accès privé (voir V5.1 §5.3) :
  #   - nexawork-documents  (GED + pièces jointes + réunions persistées)
  #   - nexawork-messaging  (fichiers canaux + conversations + partage réunion)
  #   - nexawork-users      (avatars, photos de profil)
  # Utilise l'image officielle du client `mc` — plus légère et prête à l'emploi.
  # Le container s'arrête normalement après exécution (restart: no).
  minio-init:
    image: minio/mc:latest
    container_name: nexawork-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASS: ${MINIO_PASS}
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    restart: "no"
    networks:
      - default

  # ─── Config Server ──────────────────────────────────────────────────────────
  config-server:
    build: ./nexawork-backend/nexawork-config-server
    container_name: nexawork-config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_PATH: /config-repo
    volumes:
      - ./nexawork-config-repo:/config-repo
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build: ./nexawork-backend/nexawork-auth-service
    container_name: nexawork-auth-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_auth_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/nexawork-auth-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Project Service ────────────────────────────────────────────────────────
  project-service:
    build: ./nexawork-backend/nexawork-project-service
    container_name: nexawork-project-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_project_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8082:8082"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/nexawork-project-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Messaging Service ──────────────────────────────────────────────────────
  messaging-service:
    build: ./nexawork-backend/nexawork-messaging-service
    container_name: nexawork-messaging-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_messaging_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8083:8083"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/nexawork-messaging-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Meeting Service ────────────────────────────────────────────────────────
  meeting-service:
    build: ./nexawork-backend/nexawork-meeting-service
    container_name: nexawork-meeting-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_meeting_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      JAAS_APP_ID: ${JAAS_APP_ID}
      JAAS_API_KEY_ID: ${JAAS_API_KEY_ID}
      JAAS_PRIVATE_KEY: ${JAAS_PRIVATE_KEY}
    ports:
      - "8084:8084"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/nexawork-meeting-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Notification Service ───────────────────────────────────────────────────
  notification-service:
    build: ./nexawork-backend/nexawork-notification-service
    container_name: nexawork-notification-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_notification_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "8085:8085"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/nexawork-notification-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── File Service ───────────────────────────────────────────────────────────
  file-service:
    build: ./nexawork-backend/nexawork-file-service
    container_name: nexawork-file-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_file_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
    ports:
      - "8086:8086"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/nexawork-file-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── GED Service ────────────────────────────────────────────────────────────
  ged-service:
    build: ./nexawork-backend/nexawork-ged-service
    container_name: nexawork-ged-service
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_ged_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8087:8087"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/nexawork-ged-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    build: ./nexawork-backend/nexawork-api-gateway
    container_name: nexawork-api-gateway
    depends_on:
      - auth-service
      - project-service
      - messaging-service
      - meeting-service
      - notification-service
      - file-service
      - ged-service
    environment:
      CONFIG_SERVER_URL: config-server
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH_SERVICE_HOST: auth-service
      PROJECT_SERVICE_HOST: project-service
      MESSAGING_SERVICE_HOST: messaging-service
      MEETING_SERVICE_HOST: meeting-service
      NOTIFICATION_SERVICE_HOST: notification-service
      FILE_SERVICE_HOST: file-service
      GED_SERVICE_HOST: ged-service
    ports:
      - "8080:8080"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend Angular ────────────────────────────────────────────────────────
  frontend:
    build: ./nexawork-frontend
    container_name: nexawork-frontend
    depends_on:
      - api-gateway
    ports:
      - "4200:80"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

# ─── Réseaux ────────────────────────────────────────────────────────────────
networks:
  default:
    driver: bridge
