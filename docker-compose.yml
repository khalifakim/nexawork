name: nexawork

# ─── Options JVM communes (CAUSE RACINE des « serveur ne répond pas ») ─────────
# Sans limite, chaque JVM Spring Boot en conteneur fixe son heap à ~25 % de la RAM
# Docker (~1,2 Go/service). Avec 9 services, cela réclame ~10 Go sur ~4,8 Go → swap
# permanent → lenteur → timeouts, famine Hikari, connexions PostgreSQL perdues.
#
# Mesuré le 2026-07-13 (VM Docker de 4,9 Go) : used 3870 Mo, free 95 Mo, SWAP 1034 Mo.
# Le noyau ne tuait personne (aucun OOM au dmesg) — il SWAPPAIT, ce qui est pire :
# les JVM se figeaient (« thread starvation », housekeeper delta = 1 min 17 s), les
# clients PostgreSQL coupaient (« Broken pipe »), le postmaster y voyait un crash et
# repartait en récupération — laquelle n'aboutissait jamais (fsync > 50 s, disque
# saturé par le swap) → boucle de crash → « le serveur ne répond pas ».
#
#   -Xmx192m              heap réellement utilisé < 150 Mo par service (mesuré)
#   -XX:TieredStopAtLevel=1  JIT C1 seul : ~2× moins de CPU et de code cache. Sur une
#                         machine à 2 cœurs qui porte 9 services, la compilation C2
#                         coûte plus qu'elle ne rapporte.
#   -Xss512k              9 services × ~50 threads : 512k au lieu de 1 Mo = −25 Mo/service
#   +ExitOnOutOfMemoryError  un service à court de mémoire MEURT (et redémarre, cf.
#                         restart: unless-stopped) au lieu d'agoniser en boucle de GC
#                         et d'entraîner toute la VM avec lui.
# Le second levier (le plus gros) est côté pool de connexions : voir le bloc Hikari
# de nexawork-config-repo/application.yml.
x-java-opts: &JAVA_OPTS "-Xms32m -Xmx192m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m -Xss512k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"

# ─── Garde-fous mémoire ────────────────────────────────────────────────────────
# `-Xmx` ne borne QUE le tas : le metaspace, les piles de threads, le code JIT et les
# buffers directs s'y ajoutent (project-service était mesuré à 458 Mo pour Xmx=256m).
# `mem_limit` borne le conteneur POUR DE VRAI. Ces plafonds sont des garde-fous, pas
# des réservations : l'empreinte attendue est ~300 Mo par service. Ils garantissent
# qu'aucun service emballé ne puisse à nouveau pousser la VM dans le swap.
x-svc-mem: &SVC_MEM 448m

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: nexawork-postgres
    init: true
    restart: unless-stopped
    # PostgreSQL est le service critique : il a la part la plus large et la garantie
    # de ne jamais être la victime d'une pression mémoire venue des services.
    mem_limit: 768m
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexawork-redis
    init: true
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: nexawork-rabbitmq
    init: true
    restart: unless-stopped
    mem_limit: 384m
    environment:
      # Pas de RABBITMQ_VM_MEMORY_HIGH_WATERMARK ici : la variable est DÉPRÉCIÉE et
      # l'image refuse de démarrer si elle est présente. Inutile de toute façon —
      # RabbitMQ lit la limite du cgroup, donc `mem_limit` ci-dessus le borne déjà
      # (sans elle, Erlang lisait les 4,9 Go de la VM entière).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: "nexawork-cookie"
      # Schedulers Erlang : ne pas tourner à vide (busy-wait) quand il n'y a pas de
      # travail → dormir. Sur une VM à 4 cœurs, RabbitMQ brûlait ~1,5 cœur au repos.
      # Réglage CPU pur : ne change RIEN au comportement de la messagerie (files,
      # échanges, ordre, fiabilité identiques). Réveil sur message = latence µs.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  # ─── RabbitMQ Init (sidecar one-shot) ───────────────────────────────────────
  # Applique scripts/init-rabbitmq.sh une fois que RabbitMQ est healthy :
  # crée l'exchange nexawork.events + les 7 queues métier + leurs bindings.
  # Le container s'arrête normalement après exécution (restart: no).
  # Le script rabbitmqadmin est fourni par l'image rabbitmq:3-management.
  # Voir 6-notes/PLAN_DEV_BACKEND.md §E.1 pour la justification du sidecar.
  rabbitmq-init:
    image: rabbitmq:3-management
    container_name: nexawork-rabbitmq-init
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_MGMT_PORT: 15672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./scripts/init-rabbitmq.sh:/init-rabbitmq.sh:ro
    entrypoint: ["/bin/bash", "/init-rabbitmq.sh"]
    restart: "no"
    networks:
      - default

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nexawork-minio
    init: true
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── MinIO Init (sidecar one-shot) ──────────────────────────────────────────
  # Applique scripts/init-minio.sh une fois que MinIO est healthy : crée les
  # 3 buckets métier en accès privé (voir V5.1 §5.3) :
  #   - nexawork-documents  (GED + pièces jointes + réunions persistées)
  #   - nexawork-messaging  (fichiers canaux + conversations + partage réunion)
  #   - nexawork-users      (avatars, photos de profil)
  # Utilise l'image officielle du client `mc` — plus légère et prête à l'emploi.
  # Le container s'arrête normalement après exécution (restart: no).
  minio-init:
    image: minio/mc:latest
    container_name: nexawork-minio-init
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER}
      MINIO_PASS: ${MINIO_PASS}
    volumes:
      - ./scripts/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    restart: "no"
    networks:
      - default

  # ─── Config Server ──────────────────────────────────────────────────────────
  config-server:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-config-server/Dockerfile
    container_name: nexawork-config-server
    init: true
    restart: unless-stopped
    mem_limit: 320m
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_REPO_PATH: /config-repo
      # Le Config Server résout lui-même les placeholders des YAML servis (dont
      # ${CORS_ORIGINS} de nexawork-gateway.yml) : la variable doit donc être
      # présente ICI, pas seulement sur la Gateway.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    volumes:
      - ./nexawork-config-repo:/config-repo
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-auth-service/Dockerfile
    container_name: nexawork-auth-service
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_auth_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      # Documentation OpenAPI/Swagger — DÉSACTIVÉE par défaut : son initialisation
      # coûte ~80 s au premier appel sur cette machine (mesuré : 81 445 ms) et sature
      # le CPU, ce qui fait dépasser le timeout de 20 s du frontend.
      # Pour l'activer ponctuellement :
      #   SPRINGDOC_ENABLED=true docker compose up -d --no-deps --force-recreate auth-service
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    ports:
      - "8081:8081"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/nexawork-auth-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Project Service ────────────────────────────────────────────────────────
  project-service:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-project-service/Dockerfile
    container_name: nexawork-project-service
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_project_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8082:8082"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/nexawork-project-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Messaging Service ──────────────────────────────────────────────────────
  messaging-service:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-messaging-service/Dockerfile
    container_name: nexawork-messaging-service
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_messaging_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8083:8083"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/nexawork-messaging-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Meeting Service ────────────────────────────────────────────────────────
  meeting-service:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-meeting-service/Dockerfile
    container_name: nexawork-meeting-service
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_meeting_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      JAAS_APP_ID: ${JAAS_APP_ID}
      JAAS_API_KEY_ID: ${JAAS_API_KEY_ID}
      JAAS_PRIVATE_KEY: ${JAAS_PRIVATE_KEY}
    ports:
      - "8084:8084"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/nexawork-meeting-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── Notification Service ───────────────────────────────────────────────────
  notification-service:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-notification-service/Dockerfile
    container_name: nexawork-notification-service
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_notification_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      # SMTP (email pour certains types de notifications — table §4.7)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      # Web Push VAPID (Lot 8C)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - "8085:8085"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/nexawork-notification-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── File Service ───────────────────────────────────────────────────────────
  file-service:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-file-service/Dockerfile
    container_name: nexawork-file-service
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_file_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      MINIO_URL: http://minio:9000
      # Alignés sur le config-repo nexawork-file.yml (${MINIO_USER}/${MINIO_PASS})
      MINIO_USER: ${MINIO_USER}
      MINIO_PASS: ${MINIO_PASS}
    ports:
      - "8086:8086"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/nexawork-file-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── GED Service ────────────────────────────────────────────────────────────
  ged-service:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-ged-service/Dockerfile
    container_name: nexawork-ged-service
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      config-server: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      DB_HOST: postgres
      DB_NAME: nexawork_ged_db
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      # Appel synchrone GED → Project pour le dossier virtuel TASK_ATTACHMENTS (§10.5bis)
      PROJECT_SERVICE_HOST: project-service
    ports:
      - "8087:8087"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/nexawork-ged-api-v1/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ─── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./nexawork-backend
      dockerfile: nexawork-api-gateway/Dockerfile
    container_name: nexawork-api-gateway
    init: true
    restart: unless-stopped
    mem_limit: *SVC_MEM
    # Les hôtes downstream sont résolus paresseusement (au premier appel routé) ;
    # seuls config-server (config) et auth-service (seul service métier livré à ce
    # stade) sont exigés healthy. Les autres depends_on seront réintroduits au fil
    # des phases 4-9, à mesure que leurs services deviennent buildables.
    depends_on:
      config-server: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      project-service: { condition: service_healthy }
      file-service: { condition: service_healthy }
      ged-service: { condition: service_healthy }
      messaging-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      meeting-service: { condition: service_healthy }
    environment:
      JAVA_TOOL_OPTIONS: *JAVA_OPTS
      CONFIG_SERVER_URL: config-server
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      AUTH_SERVICE_HOST: auth-service
      PROJECT_SERVICE_HOST: project-service
      MESSAGING_SERVICE_HOST: messaging-service
      MEETING_SERVICE_HOST: meeting-service
      NOTIFICATION_SERVICE_HOST: notification-service
      FILE_SERVICE_HOST: file-service
      GED_SERVICE_HOST: ged-service
    ports:
      - "8080:8080"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend Angular ────────────────────────────────────────────────────────
  frontend:
    build: ./nexawork-frontend
    container_name: nexawork-frontend
    init: true
    restart: unless-stopped
    mem_limit: 96m
    depends_on:
      - api-gateway
    ports:
      # IPv4 EXPLICITE. Avec « 4200:80 », Docker publie AUSSI sur [::]:4200 — or sur ce
      # poste l'écouteur IPv6 accepte la connexion puis la coupe. Comme `localhost` se
      # résout en ::1 AVANT 127.0.0.1, le navigateur tombait dessus : ERR_CONNECTION_RESET
      # intermittent sur les chunks JS (page blanche), alors que 127.0.0.1:4200 répondait
      # 200. Publier en IPv4 seul supprime l'écouteur fautif : plus rien à intercepter.
      - "0.0.0.0:4200:80"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

# ─── Réseaux ────────────────────────────────────────────────────────────────
networks:
  default:
    driver: bridge
